[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pact-auth"
version = "0.1.0"
description = "Sovereign Agent Authentication Protocol — Python SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "anzal1" }]
keywords = ["ai", "agent", "authentication", "delegation", "ed25519", "pact"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["cryptography>=41.0"]

[project.urls]
Homepage = "https://github.com/anzal1/pact"
Repository = "https://github.com/anzal1/pact"
Documentation = "https://github.com/anzal1/pact/blob/main/SPEC.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["pact"]
